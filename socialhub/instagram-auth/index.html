<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinculando con Instagram... | HubSocial AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #f4f7f6;
            color: #333;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: inline-block;
            max-width: 400px;
            width: 100%;
        }

        .btn {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            padding: 16px 30px;
            text-decoration: none;
            border-radius: 10px;
            display: inline-block;
            margin-top: 25px;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .logo {
            font-size: 3em;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">📸</div>
        <h2>¡Autorización Exitosa!</h2>
        <p>Estamos redirigiéndote de vuelta a la aplicación <strong>HubSocial AI</strong> para completar la
            vinculación.</p>

        <a id="btn-manual" class="btn" href="#">ABRIR APLICACIÓN</a>

        <p style="margin-top: 20px; font-size: 12px; color: #999;">
            Si la aplicación no se abre sola en 3 segundos, pulsa el botón de arriba.
        </p>
    </div>

    <script>
        // Capturar los parámetros de la URL (el 'code' enviado por Instagram)
        const params = new URLSearchParams(window.location.search);
        let code = params.get('code');

        if (code) {
            // Eliminar hash residual (#_ o #) que Instagram añade al final de la URL
            code = code.replace(/#_.*$/, '').replace(/#.*$/, '');

            // Codificar explícitamente con encodeURIComponent para que '+' y caracteres especiales
            // no se corrompan como espacios al ser decodificados por Android Uri.getQueryParameter
            const deepLink = "hubsocial://instagram-auth?code=" + encodeURIComponent(code);

            // Actualizar el enlace del botón manual
            document.getElementById('btn-manual').href = deepLink;

            // Redirección única inmediata
            window.location.href = deepLink;
        } else {
            document.body.innerHTML = `
                <div class="card">
                    <div class="logo">⚠️</div>
                    <h2>Error de Conexión</h2>
                    <p>No se recibió el código de autorización de Instagram. Por favor, inténtalo de nuevo desde la app.</p>
                    <a href="/socialhub/privacy.html" class="btn" style="background: #666;">Volver</a>
                </div>
            `;
        }
    </script>
</body>

</html>
