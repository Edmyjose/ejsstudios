<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinculando X (Twitter) con Social Hub...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #0b0e14;
            color: #f8fafc;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #151921;
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
        }

        .icon {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 22px;
            color: #ffffff;
        }

        p {
            margin: 0 0 24px;
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .btn {
            background: #ffffff;
            color: #000000;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 9999px;
            display: inline-block;
            font-weight: 700;
            font-size: 15px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 24 24" fill="#ffffff">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        <h2>¡Autorización de X recibida!</h2>
        <p>Estamos redirigiéndote de vuelta a Social Hub para completar la vinculación.</p>
        <a id="btn-manual" class="btn" href="#">VOLVER A SOCIAL HUB</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');

        if (code) {
            let deepLink = "socialhub://twitter-auth?code=" + encodeURIComponent(code);
            if (state) {
                deepLink += "&state=" + encodeURIComponent(state);
            }
            document.getElementById('btn-manual').href = deepLink;

            // Redirección inmediata a la aplicación
            window.location.href = deepLink;
        } else {
            const error = params.get('error_description') || params.get('error') || 'No se recibió el código de autorización de X.';
            document.querySelector('.container').innerHTML =
                "<h2 style='color:#ef4444;'>Error de autenticación</h2><p>" + error + "</p><a class='btn' href='socialhub://twitter-auth'>Volver a la app</a>";
        }
    </script>
</body>

</html>
