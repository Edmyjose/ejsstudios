<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinculando LinkedIn con Social Hub...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 22px;
            color: #0a66c2;
        }

        p {
            margin: 0 0 24px;
            font-size: 15px;
            color: #64748b;
            line-height: 1.5;
        }

        .btn {
            background: #0a66c2;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #084e96;
        }
    </style>
</head>

<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 24 24" fill="#0A66C2">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.45a1.64 1.64 0 1 0 0 3.28 1.64 1.64 0 0 0 0-3.28Z"/>
        </svg>
        <h2>¡Autorización recibida!</h2>
        <p>Estamos redirigiéndote de vuelta a Social Hub para completar la vinculación.</p>
        <a id="btn-manual" class="btn" href="#">PULSA AQUÍ PARA VOLVER A LA APP</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');

        if (code) {
            let deepLink = "socialhub://linkedin-auth?code=" + encodeURIComponent(code);
            if (state) {
                deepLink += "&state=" + encodeURIComponent(state);
            }
            document.getElementById('btn-manual').href = deepLink;

            // Redirección inmediata a la aplicación
            window.location.href = deepLink;
        } else {
            const error = params.get('error_description') || params.get('error') || 'No se recibió el código de autorización.';
            document.querySelector('.container').innerHTML =
                "<h2 style='color:#dc2626;'>Error de autenticación</h2><p>" + error + "</p><a class='btn' href='socialhub://linkedin-auth'>Volver a la app</a>";
        }
    </script>
</body>

</html>
